name: Full Stack CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Start Infrastructure (PostgreSQL & Redis)
        run: docker compose -f infrastructure/docker-compose.yml up -d postgres redis

      # Wait until Postgres really accepts connections (avoid race).
      - name: Wait for PostgreSQL readiness
        run: |
          for i in $(seq 1 30); do
            if docker exec culinary_postgres pg_isready -U postgres -d culinary_blog; then
              echo "PostgreSQL is ready."
              exit 0
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
          echo "PostgreSQL did not become ready in time."
          docker compose -f infrastructure/docker-compose.yml logs postgres
          exit 1

      - name: Restore dependencies
        run: dotnet restore backend/CulinaryBlog.slnx

      - name: Build
        run: dotnet build backend/CulinaryBlog.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test backend/CulinaryBlog.slnx --configuration Release --no-build --verbosity normal

      - name: Stop CI infrastructure
        if: always()
        run: docker compose -f infrastructure/docker-compose.yml down

  frontend-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: TypeScript type-check
        run: cd frontend && npx tsc --noEmit

      - name: ESLint
        run: cd frontend && npm run lint

      - name: Build Next.js
        run: cd frontend && npm run build
